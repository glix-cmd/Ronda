<!doctype html>
<html><head><meta charset="utf-8"><style>body{margin:0;background:#000}canvas{display:block}</style></head>
<body>
<script>
/* Generador de placas de atmósfera para Ronda (velas, luces desenfocadas, sala).
   Determinista: cada placa usa su propia semilla. */
function prng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const C={ambar:[255,178,92],naranja:[236,112,42],blanco:[255,226,176],rojo:[214,74,38],miel:[246,150,60]};
function rgba(c,a){return `rgba(${c[0]},${c[1]},${c[2]},${a})`}
function bokeh(ctx,x,y,r,c,a){
  const g=ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,rgba(c,a*.5));g.addColorStop(.78,rgba(c,a*.62));g.addColorStop(.92,rgba(c,a*.85));g.addColorStop(1,rgba(c,0));
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
}
function halo(ctx,x,y,r,c,a){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,rgba(c,a));g.addColorStop(.35,rgba(c,a*.45));g.addColorStop(1,rgba(c,0));ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2)}
function vela(ctx,x,y,s,blur){ // y = base de la llama
  ctx.save();ctx.filter=`blur(${blur}px)`;ctx.globalCompositeOperation='lighter';
  halo(ctx,x,y-s*1.2,s*16,C.naranja,.22);halo(ctx,x,y-s*1.2,s*6,C.ambar,.35);
  ctx.globalCompositeOperation='source-over';
  // cuerpo de la vela
  const cw=s*2.1,ch=s*5.2;
  const gb=ctx.createLinearGradient(x,y+s*.6,x,y+s*.6+ch);gb.addColorStop(0,'rgba(240,190,130,.82)');gb.addColorStop(.3,'rgba(150,88,48,.7)');gb.addColorStop(1,'rgba(22,12,7,.9)');
  ctx.fillStyle=gb;ctx.beginPath();ctx.ellipse(x,y+s*.6,cw/2,cw*.18,0,0,Math.PI*2);ctx.fill();ctx.fillRect(x-cw/2,y+s*.6,cw,ch);
  // llama
  ctx.globalCompositeOperation='lighter';
  const gf=ctx.createRadialGradient(x,y-s*.6,0,x,y-s*.9,s*2.2);gf.addColorStop(0,'rgba(255,250,235,1)');gf.addColorStop(.35,'rgba(255,214,130,.95)');gf.addColorStop(.7,'rgba(240,130,50,.6)');gf.addColorStop(1,'rgba(200,70,20,0)');
  ctx.fillStyle=gf;ctx.beginPath();ctx.moveTo(x,y-s*3.2);ctx.bezierCurveTo(x+s*.9,y-s*1.6,x+s*.8,y-s*.1,x,y+s*.25);ctx.bezierCurveTo(x-s*.8,y-s*.1,x-s*.9,y-s*1.6,x,y-s*3.2);ctx.fill();
  ctx.restore();
}
function silueta(ctx,x,y,s,a){ // cabeza y hombros muy desenfocados, sin rasgos
  ctx.save();ctx.filter=`blur(${Math.round(s*.18)}px)`;ctx.fillStyle=`rgba(4,3,2,${a})`;
  ctx.beginPath();ctx.ellipse(x,y,s*.42,s*.52,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.moveTo(x-s*1.6,y+s*2.6);ctx.bezierCurveTo(x-s*1.4,y+s*.9,x-s*.6,y+s*.55,x,y+s*.55);ctx.bezierCurveTo(x+s*.6,y+s*.55,x+s*1.4,y+s*.9,x+s*1.6,y+s*2.6);ctx.closePath();ctx.fill();
  ctx.restore();
}
function grano(ctx,w,h,f,r){const d=ctx.getImageData(0,0,w,h),p=d.data;for(let i=0;i<p.length;i+=4){const n=(r()-.5)*f;p[i]+=n;p[i+1]+=n;p[i+2]+=n}ctx.putImageData(d,0,0)}
function vineta(ctx,w,h,a,cx,cy){const g=ctx.createRadialGradient(w*(cx||.5),h*(cy||.45),Math.min(w,h)*.2,w*.5,h*.5,Math.max(w,h)*.75);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(0,0,0,${a})`);ctx.fillStyle=g;ctx.fillRect(0,0,w,h)}
function fondo(ctx,w,h,base){ctx.fillStyle=base||'#070504';ctx.fillRect(0,0,w,h)}
function campoBokeh(ctx,w,h,r,n,opt){
  for(let i=0;i<n;i++){
    const t=r(), x=w*(opt.x0+r()*(opt.x1-opt.x0)), y=h*(opt.y0+Math.pow(r(),opt.pow||1)*(opt.y1-opt.y0));
    const rad=opt.rmin+Math.pow(r(),2)*(opt.rmax-opt.rmin);
    const col=t<.55?C.ambar:t<.78?C.miel:t<.92?C.naranja:C.blanco;
    bokeh(ctx,x,y,rad,col,opt.a*(.45+r()*.55));
  }
}
/* Viraje cálido: las altas luces que «lighter» recorta a blanco se oscurecían hacia el oliva.
   Mezcla cada píxel con una rampa de brasa a ámbar según su luminancia, así nada queda neutro. */
const RAMPA=[[0,[6,4,3]],[.22,[64,26,10]],[.5,[178,92,36]],[.78,[246,178,104]],[1,[255,232,196]]];
function rampa(l){for(let i=1;i<RAMPA.length;i++){if(l<=RAMPA[i][0]){const a=RAMPA[i-1],b=RAMPA[i],t=(l-a[0])/(b[0]-a[0]);return [0,1,2].map(k=>a[1][k]+(b[1][k]-a[1][k])*t)}}return RAMPA[RAMPA.length-1][1]}
function virar(ctx,w,h,f){const d=ctx.getImageData(0,0,w,h),p=d.data;for(let i=0;i<p.length;i+=4){const l=(.2126*p[i]+.7152*p[i+1]+.0722*p[i+2])/255,c=rampa(l);p[i]+= (c[0]-p[i])*f;p[i+1]+=(c[1]-p[i+1])*f;p[i+2]+=(c[2]-p[i+2])*f}ctx.putImageData(d,0,0)}
function lienzo(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;document.body.appendChild(c);return c}

/* 1. Sala de noche (portada) */
function salaNoche(w,h,seed){
  const c=lienzo(w,h),x=c.getContext('2d'),r=prng(seed),k=w/2400;
  fondo(x,w,h,'#060403');
  // calor ambiental de la sala
  x.globalCompositeOperation='lighter';
  halo(x,w*.5,h*.38,w*.55,[90,40,16],.55);halo(x,w*.18,h*.3,w*.25,[110,52,20],.4);halo(x,w*.84,h*.34,w*.28,[120,56,22],.38);
  // luces lejanas muy desenfocadas
  x.filter=`blur(${20*k}px)`;campoBokeh(x,w,h,r,48,{x0:-.05,x1:1.05,y0:.06,y1:.6,rmin:40*k,rmax:150*k,a:.32,pow:1.2});
  x.filter=`blur(${5*k}px)`;campoBokeh(x,w,h,r,70,{x0:0,x1:1,y0:.1,y1:.52,rmin:10*k,rmax:42*k,a:.46,pow:1.1});
  x.filter='none';x.globalCompositeOperation='source-over';
  // comensales desenfocados en el plano medio
  [[.14,.52,170],[.27,.56,150],[.73,.53,160],[.86,.57,175],[.6,.6,120]].forEach(s=>silueta(x,w*s[0],h*s[1],s[2]*k,.82));
  // mesa en primer plano
  const gm=x.createLinearGradient(0,h*.7,0,h);gm.addColorStop(0,'rgba(18,10,6,0)');gm.addColorStop(.25,'rgba(22,12,7,.92)');gm.addColorStop(1,'rgba(6,4,3,1)');x.fillStyle=gm;x.fillRect(0,h*.68,w,h*.32);
  x.globalCompositeOperation='lighter';
  // reflejos alargados sobre la mesa
  x.filter=`blur(${14*k}px)`;for(let i=0;i<26;i++){const xx=w*r(),yy=h*(.8+r()*.12);x.fillStyle=rgba(r()<.6?C.ambar:C.naranja,.07+r()*.08);x.fillRect(xx,yy,(10+r()*24)*k,(60+r()*120)*k)}
  x.filter='none';
  // velas: dos cercanas desenfocadas y una nítida
  vela(x,w*.08,h*.84,34*k,10*k);vela(x,w*.93,h*.86,30*k,12*k);vela(x,w*.71,h*.8,16*k,3*k);vela(x,w*.3,h*.82,13*k,4*k);
  x.globalCompositeOperation='source-over';
  vineta(x,w,h,.82,.5,.42);virar(x,w,h,.42);grano(x,w,h,16,r);return c;
}
/* 2. Barra de noche (interludio) */
function barraNoche(w,h,seed){
  const c=lienzo(w,h),x=c.getContext('2d'),r=prng(seed),k=w/2400;
  fondo(x,w,h,'#050403');x.globalCompositeOperation='lighter';
  halo(x,w*.5,h*.45,w*.5,[100,44,16],.5);
  // hilera de lámparas sobre la barra
  x.filter=`blur(${10*k}px)`;for(let i=0;i<16;i++){const xx=w*(.02+i/15*.96)+(r()-.5)*40*k;bokeh(x,xx,h*(.3+(r()-.5)*.11),(30+Math.pow(r(),1.6)*95)*k,i%4==0?C.blanco:C.ambar,.38+r()*.42)}
  x.filter=`blur(${22*k}px)`;campoBokeh(x,w,h,r,50,{x0:0,x1:1,y0:.05,y1:.6,rmin:60*k,rmax:170*k,a:.22});
  x.globalCompositeOperation='source-over';
  // barra brillante
  x.filter=`blur(${4*k}px)`;const gb=x.createLinearGradient(0,h*.55,0,h*.62);gb.addColorStop(0,'rgba(255,190,110,.28)');gb.addColorStop(1,'rgba(40,20,10,.0)');x.fillStyle=gb;x.fillRect(0,h*.55,w,h*.07);
  const gm=x.createLinearGradient(0,h*.58,0,h);gm.addColorStop(0,'rgba(20,11,6,.95)');gm.addColorStop(1,'rgba(5,3,2,1)');x.fillStyle=gm;x.fillRect(0,h*.6,w,h*.4);
  x.globalCompositeOperation='lighter';x.filter=`blur(${16*k}px)`;
  for(let i=0;i<16;i++){const xx=w*(.02+i/15*.96);x.fillStyle=rgba(C.ambar,.1+r()*.08);x.fillRect(xx-14*k,h*.64,28*k,(90+r()*90)*k)}
  x.filter='none';vela(x,w*.22,h*.78,20*k,6*k);vela(x,w*.8,h*.8,24*k,8*k);
  x.globalCompositeOperation='source-over';vineta(x,w,h,.85,.5,.4);virar(x,w,h,.42);grano(x,w,h,16,r);return c;
}
/* 3. Mesa con velas (fondo del contacto) */
function mesaVelas(w,h,seed){
  const c=lienzo(w,h),x=c.getContext('2d'),r=prng(seed),k=w/2400;
  fondo(x,w,h,'#050302');x.globalCompositeOperation='lighter';
  halo(x,w*.3,h*.55,w*.45,[110,48,18],.5);
  x.filter=`blur(${26*k}px)`;campoBokeh(x,w,h,r,60,{x0:-.05,x1:.75,y0:.05,y1:.6,rmin:50*k,rmax:180*k,a:.26});
  x.filter=`blur(${8*k}px)`;campoBokeh(x,w,h,r,50,{x0:0,x1:.7,y0:.1,y1:.55,rmin:14*k,rmax:40*k,a:.32});
  x.filter='none';x.globalCompositeOperation='source-over';
  const gm=x.createLinearGradient(0,h*.62,0,h);gm.addColorStop(0,'rgba(24,13,7,0)');gm.addColorStop(.2,'rgba(26,14,8,.95)');gm.addColorStop(1,'rgba(6,4,3,1)');x.fillStyle=gm;x.fillRect(0,h*.6,w,h*.4);
  x.globalCompositeOperation='lighter';
  vela(x,w*.12,h*.74,26*k,6*k);vela(x,w*.27,h*.78,18*k,2*k);vela(x,w*.46,h*.76,22*k,4*k);vela(x,w*.88,h*.82,36*k,14*k);
  x.globalCompositeOperation='source-over';vineta(x,w,h,.8,.3,.5);virar(x,w,h,.42);grano(x,w,h,16,r);return c;
}
/* 4. Retrato vertical: una vela muy cerca (hueco de retrato real) */
function retratoVela(w,h,seed){
  const c=lienzo(w,h),x=c.getContext('2d'),r=prng(seed),k=w/900;
  fondo(x,w,h,'#050302');x.globalCompositeOperation='lighter';
  halo(x,w*.5,h*.48,w*.9,[100,42,16],.55);
  x.filter=`blur(${22*k}px)`;campoBokeh(x,w,h,r,26,{x0:-.1,x1:1.1,y0:.02,y1:.5,rmin:40*k,rmax:120*k,a:.3});
  x.filter='none';x.globalCompositeOperation='source-over';
  const gm=x.createLinearGradient(0,h*.66,0,h);gm.addColorStop(0,'rgba(24,13,7,0)');gm.addColorStop(.25,'rgba(24,13,7,.95)');gm.addColorStop(1,'rgba(5,3,2,1)');x.fillStyle=gm;x.fillRect(0,h*.64,w,h*.36);
  vela(x,w*.5,h*.6,44*k,1.5*k);vela(x,w*.2,h*.7,16*k,7*k);
  x.globalCompositeOperation='source-over';vineta(x,w,h,.85,.5,.5);virar(x,w,h,.42);grano(x,w,h,14,r);return c;
}
window.placas={
  'sala-noche':()=>salaNoche(2400,1400,11),
  'sala-noche-vertical':()=>salaNoche(1100,1600,11),
  'barra-noche':()=>barraNoche(2400,1100,23),
  'mesa-velas':()=>mesaVelas(2400,1500,37),
  'retrato-vela':()=>retratoVela(900,1200,41)
};
</script>
</body></html>
